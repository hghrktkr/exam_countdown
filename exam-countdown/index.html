
<!doctype html>
<html lang="ja">

  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="テストまでの残り時間を確認できるカウントダウンサイト"
    />
    <title>テストカウントダウン</title>
  </head>

  <body>
    <header class="site-header">
      <h1 class="site-title">テストまでの残り日数</h1>
    </header>

    <main class="main-content">

      <!-- 登録済み試験の表示 -->
      <section id="countdown">
        <div id="selected-exams">
          <!-- renderSelectedExams()で作成 -->
        </div>
      </section>

      <button
        type="button"
        id="toggle-register"
        aria-controls="register"
        aria-expanded="false"
      >
        テストを登録・編集する
      </button>

      <!-- 試験の登録 -->
      <section id="register" class="section" hidden>
        <h2 class="section-title">テストを登録する</h2>
        <p>テスト名と日付を登録します。</p>
        <form id="register-form">
          <label for="exam-name">テスト名</label>
          <input
            type="text"
            id="exam-name"
            name="exam-name"
            required
          />

          <label for="exam-date">テスト開始日</label>
          <input
            type="date"
            id="exam-date"
            name="exam-date"
            required
          />

          <button type="submit" id="register-exam">登録</button>
          <button type="button" id="cancel-exam">キャンセル</button>
        </form>
      </section>

      <!-- 登録済み試験の選択 -->
      <section id="display" class="section" hidden>

        <h2 class="section-title">登録されたテスト一覧</h2>
        
        <p id="selection-warning" class="warning-message" hidden>
          表示できる試験は最大3件です。
        </p>
        <div class="exam-list" id="exam-list">
          <!-- renderExamList()で作成 -->
        </div>
      </section>

    </main>

    <footer class="site-footer">
      <p>&copy; 2026 Academia</p>
    </footer>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
